plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.workspace.qwen.asr'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.workspace.qwen.asr'
        minSdk 33
        targetSdk 36
        versionCode 2
        versionName '0.1.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            jniLibs.srcDir 'runtime/jniLibs'
            assets.srcDir 'runtime/assets'
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/*.so']
        }
    }
}
