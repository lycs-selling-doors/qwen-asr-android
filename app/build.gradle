plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'dev.workspace.qwen.asr'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.workspace.qwen.asr'
        minSdk 33
        targetSdk 36
        versionCode 5
        versionName '0.2.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    flavorDimensions += 'runtime'
    productFlavors {
        snapdragon {
            dimension 'runtime'
            buildConfigField 'boolean', 'CPU_ONLY', 'false'
            buildConfigField 'String', 'RUNTIME_LABEL', '"llama.cpp b12470 · Snapdragon arm64"'
        }
        cpu {
            dimension 'runtime'
            versionNameSuffix '-cpu'
            buildConfigField 'boolean', 'CPU_ONLY', 'true'
            buildConfigField 'String', 'RUNTIME_LABEL', '"llama.cpp b12470 · ARM64 CPU"'
        }
    }
    sourceSets {
        snapdragon {
            jniLibs.srcDir 'runtime/jniLibs'
            assets.srcDir 'runtime/assets'
        }
        cpu {
            jniLibs.srcDir 'runtime-cpu/jniLibs'
            assets.srcDir 'runtime-cpu/assets'
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/*.so']
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.10.01')
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'com.google.mlkit:language-id:17.0.6'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250107'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}

def registerVerifyRuntime = { String taskName, String manifestFile, String runtimeDir ->
    tasks.register(taskName) {
        inputs.file rootProject.file(manifestFile)
        inputs.dir layout.projectDirectory.dir(runtimeDir).asFile
        doLast {
            rootProject.file(manifestFile).eachLine { line ->
                if (line.trim().isEmpty()) return
                def (expected, relative) = line.split(' ', 2)
                def asset = rootProject.file(relative)
                if (!asset.isFile()) {
                    throw new GradleException("Missing Android runtime: ${relative}. Run Stage-PinnedRuntime.ps1.")
                }
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                asset.withInputStream { input ->
                    def bytes = new byte[1024 * 1024]
                    int count
                    while ((count = input.read(bytes)) != -1) digest.update(bytes, 0, count)
                }
                if (digest.digest().encodeHex().toString() != expected) {
                    throw new GradleException("Android runtime checksum mismatch: ${relative}")
                }
            }
        }
    }
}

def verifyPinnedRuntime = registerVerifyRuntime('verifyPinnedRuntime', 'Runtime-SHA256.txt', 'runtime')
def verifyPinnedCpuRuntime = registerVerifyRuntime('verifyPinnedCpuRuntime', 'Runtime-CPU-SHA256.txt', 'runtime-cpu')

tasks.matching { it.name == 'preSnapdragonReleaseBuild' }.configureEach {
    dependsOn verifyPinnedRuntime
}
tasks.matching { it.name == 'preCpuReleaseBuild' }.configureEach {
    dependsOn verifyPinnedCpuRuntime
}
